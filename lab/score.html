<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='54' font-size='54'%3E%F0%9F%96%8C%3C/text%3E%3C/svg%3E">
<title>Character Lab · scores</title>
<style>
  body { margin: 0; background: #efe9de; color: #2b2118; font: 13px/1.35 system-ui, sans-serif; }
  main { padding: 12px; }
  table { border-collapse: collapse; background: #fff; }
  th, td { padding: 3px 8px; border-bottom: 1px solid #e6dccb; text-align: right; white-space: nowrap; }
  th:first-child, td:first-child, td:nth-child(2) { text-align: left; }
  .bad { color: #a3361f; font-weight: 600; } .ok { color: #8a6a12; } .good { color: #2f6b2a; font-weight: 600; }
  #row { display: flex; gap: 6px; } #row canvas { background: #fff; display: block; }
  #out { white-space: pre-wrap; font: 11px ui-monospace, monospace; }
</style>
</head>
<body>
<main>
  <div id="row"></div>
  <div id="table"></div>
  <pre id="out">scoring…</pre>
</main>
<script src="js/lab-geom.js"></script>
<script src="js/wc-gl.js"></script>
<script src="js/wc-compare.js"></script>
<script src="js/wc-display-score.js"></script>
<script src="js/wc-region-math.js"></script>
<script src="js/wc-regions.js"></script>
<script src="js/wc-parts.js"></script>
<script src="js/wc-rig.js"></script>
<script src="js/wc-anim.js"></script>
<script src="js/wc-expressions.js"></script>
<script src="js/lab-packs.js"></script>
<script src="js/lab-loader.js"></script>
<script src="js/wc-elements.js"></script>
<script>
// Scores every variant of the Character Lab exactly as the lab does (same renderer, same metrics),
// so a part can be improved and re-measured without clicking through the lab.
//   score.html                    -> every variant: table + JSON (document.title = "DONE n")
//   score.html?part=nose          -> one part's variants
//   score.html?v=nose-front       -> one variant, plus reference | ours | difference panels
//                                    (whole character: also the per-region and missed-landmark tables)
//   &h=480                        -> panel height for ?v
//   &display=3.5                  -> also score at that many times the painting's size (wc-display-score.js)
//   &regions                      -> a whole figure with named parts (vv.regions): each measured, worst first (wc-regions.js)
// scripts/wc-lab.mjs drives this page from the command line (scores, baselines and deltas).
(async function () {
  const CharacterLab = window.CharacterLab, C = CharacterLab.wcCompare, E = CharacterLab.wcElements;
  const qs = new URLSearchParams(location.search);
  const out = document.getElementById("out");
  const SS = 3;


  const displayK = +(qs.get("display") || 0);
  // Our render at k times the painting's size beside the painting enlarged the same way.
  function displayScore(scene, img, fit, k) {
    const W = Math.round(C.FW * k), H = Math.round(C.FH * k);
    const g = document.createElement("canvas"); g.width = W; g.height = H;
    const r = CharacterLab.wcGL.create(g);
    r.render(scene, fit ? { scale: k * fit.s, ox: k * fit.tx, oy: k * fit.ty } : { scale: k, ox: 0, oy: 0 });
    const ours = document.createElement("canvas"); ours.width = W; ours.height = H; ours.getContext("2d").drawImage(g, 0, 0);
    const lose = r.gl.getExtension("WEBGL_lose_context"); if (lose) lose.loseContext();
    const ref = document.createElement("canvas"); ref.width = W; ref.height = H;
    const x = ref.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, W, H); x.imageSmoothingQuality = "high";
    C.drawRef(x, img, { scale: k, ox: 0, oy: 0 });
    return CharacterLab.wcDisplayScore.measure(ours, ref);
  }

  async function scoreVariant(vv) {
    C.setTrace(E.trace(vv));
    const img = await C.loadRef();
    // a posed figure (a rig pose: js/wc-rig.js) is scored as its still picture, every part moved
    const built = E.build(vv, {}, null), scene = built && CharacterLab.wcRig.flatten(built);
    if (!scene) {
      const ref = C.figureCanvas((x) => C.drawRef(x, img, { scale: 1, ox: 0, oy: 0 }));
      return { id: vv.id, part: vv.part, label: vv.label, renderer: false, ref };
    }
    const fit = C.fitFor(img, vv);
    const g = document.createElement("canvas"); g.width = C.FW * SS; g.height = C.FH * SS;
    const r = CharacterLab.wcGL.create(g);
    const t0 = performance.now();
    r.render(scene, fit ? { scale: SS * fit.s, ox: SS * fit.tx, oy: SS * fit.ty } : { scale: SS, ox: 0, oy: 0 });
    const ms = performance.now() - t0;
    const ours = C.figureCanvas((x) => { x.imageSmoothingQuality = "high"; x.drawImage(g, 0, 0, C.FW, C.FH); });
    const ref = C.figureCanvas((x) => C.drawRef(x, img, { scale: 1, ox: 0, oy: 0 }));
    const lose = r.gl.getExtension("WEBGL_lose_context"); if (lose) lose.loseContext();
    const s = vv.kind === "trace" ? C.score(ours, ref) : C.scoreElement(ours, ref);
    const disp = displayK ? displayScore(scene, img, fit, displayK) : null;
    const parts = vv.regions && qs.has("regions") ? CharacterLab.wcRegions.measureAll(ours, ref, vv.regions) : undefined;
    return { disp, parts, id: vv.id, part: vv.part, label: vv.label, renderer: true, kind: vv.kind || "element", ms: +ms.toFixed(1), ...s, ours, ref };
  }

  function panels(res, H) {
    const row = document.getElementById("row"), k = H / C.FH, W = Math.round(C.FW * k);
    // a variant with no renderer yet: the painting alone, to measure it
    for (const src of res.ours ? [res.ref, res.ours, C.diffCanvas(res.ours, res.ref, 2.5)] : [res.ref]) {
      const c = document.createElement("canvas"); c.width = W; c.height = H;
      const x = c.getContext("2d"); x.imageSmoothingQuality = "high"; x.drawImage(src, 0, 0, W, H);
      row.appendChild(c);
    }
  }

  function table(rows) {
    const cls = (f) => (f >= 90 ? "good" : f >= 75 ? "ok" : "bad");
    let html = `<table><tr><th>variant</th><th>part</th><th>fidelity</th><th>silhouette</th><th>ΔE</th><th>palette</th><th>SSIM</th><th>contrast</th><th>edges</th><th>texture</th></tr>`;
    for (const r of rows) {
      if (r.error) { html += `<tr><td>${r.id}</td><td>${r.part}</td><td class="bad" colspan="8">error: ${r.error}</td></tr>`; continue; }
      if (!r.renderer) { html += `<tr><td>${r.id}</td><td>${r.part}</td><td class="bad">no renderer</td><td colspan="7"></td></tr>`; continue; }
      html += `<tr><td>${r.id}</td><td>${r.part}</td><td class="${cls(r.fidelity)}">${r.fidelity}</td><td>${(r.iou * 100).toFixed(1)}%</td><td>${(r.dE4 ?? r.dE16).toFixed(1)}</td><td>${r.palette.toFixed(2)}</td><td>${r.ssim.toFixed(3)}</td><td>${r.contrast?.toFixed(2) ?? ""}</td><td>${r.edges?.toFixed(2) ?? ""}</td><td>${r.texture.toFixed(2)}</td></tr>`;
    }
    document.getElementById("table").innerHTML = html + "</table>";
  }
  // Whole character: every named part, worst first (colour, structure, texture, lightness ours | painting).
  function partsTable(parts) {
    let html = `<table><tr><th>part</th><th>score</th><th>ΔE</th><th>SSIM</th><th>contrast</th><th>edges</th><th>L 5/50/95 ours</th><th>painting</th><th>chroma</th></tr>`;
    for (const p of parts) {
      html += `<tr><td>${p.name}</td><td>${p.score}</td><td>${p.dE}</td><td>${p.ssim}</td><td>${p.contrast}</td><td>${p.edges}</td><td>${p.L.ours.join(" ")}</td><td>${p.L.ref.join(" ")}</td><td>${p.chroma.ours} | ${p.chroma.ref}</td></tr>`;
    }
    document.getElementById("table").insertAdjacentHTML("beforeend", html + "</table>");
  }
  // Whole character: where the score is lost (per region, and the landmarks that miss).
  function regionTable(r) {
    let html = `<p>features ${r.features} · landmarks ${r.landmarks}</p><table><tr><th>region</th><th>ΔE</th><th>SSIM</th><th>contrast</th><th>edges</th><th>Lab ours</th><th>Lab painting</th></tr>`;
    for (const [name, g] of Object.entries(r.regions)) {
      html += `<tr><td>${name}</td><td>${g.dE4}</td><td>${g.ssim}</td><td>${g.contrast}</td><td>${g.edges}</td><td>${g.labOurs.join(" ")}</td><td>${g.labRef.join(" ")}</td></tr>`;
    }
    html += "</table><table><tr><th>landmark</th><th>ours</th><th>painting</th><th>score</th></tr>";
    for (const m of r.landmarkRows.filter((m) => m.score < 0.95)) html += `<tr><td>${m.name}</td><td>${m.ours}</td><td>${m.ref}</td><td>${m.score.toFixed(2)}</td></tr>`;
    document.getElementById("table").insertAdjacentHTML("beforeend", html + "</table>");
  }

  try {
    const only = qs.get("v"), part = qs.get("part");
    const all = E.parts.flatMap((p) => p.variants);
    const list = only ? all.filter((v) => v.id === only) : part ? all.filter((v) => v.part === part) : all;
    if (!all.length) throw new Error("no character packs found; see packs/README.md");
    if (!list.length) throw new Error("no such variant/part");
    const rows = [];
    for (const vv of list) {
      try { rows.push(await scoreVariant(vv)); }
      catch (e) { rows.push({ id: vv.id, part: vv.part, label: vv.label, renderer: !!vv.build, error: e.message }); }
    }
    if (only && rows[0].ref) panels(rows[0], +(qs.get("h") || 420));
    table(rows);
    if (only && rows[0].regions) regionTable(rows[0]);
    if (only && rows[0].parts) partsTable(rows[0].parts);
    // landmarks that miss (score < 0.95) stay in the JSON so scripts can show them
    const lean = rows.map(({ ours, ref, regions, landmarkRows, ...r }) => (landmarkRows ? Object.assign(r, { misses: landmarkRows.filter((m) => m.score < 0.95) }) : r));
    if (displayK) document.getElementById("table").insertAdjacentHTML("beforeend", "<p>At " + displayK + "x: " +
      lean.filter((r) => r.disp).map((r) => `${r.id} SSIM ${r.disp.ssim} · GMSD ${r.disp.gmsd} · edges ×${r.disp.edges} · colour noise ×${r.disp.chroma}`).join("<br>") + "</p>");
    out.textContent = JSON.stringify(lean);
    const scored = lean.filter((r) => r.renderer && r.fidelity != null);
    const mean = scored.reduce((s, r) => s + r.fidelity, 0) / Math.max(scored.length, 1);
    document.title = `DONE ${lean.length} mean=${mean.toFixed(1)} below90=${scored.filter((r) => r.fidelity < 90).length} norenderer=${lean.filter((r) => !r.renderer).length}`;
  } catch (e) {
    out.textContent = "ERROR " + e.message; document.title = "ERROR " + e.message; console.error(e);
  }
})();
</script>
</body>
</html>
