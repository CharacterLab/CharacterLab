<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='54' font-size='54'%3E%F0%9F%96%8C%3C/text%3E%3C/svg%3E">
<title>Scenarios · Character Lab</title>
<meta name="description" content="Test a character in context: a small scene drawn by code with numeric params, the cast placed in it, params to scrub and sweep, clips to play and filmstrips to export.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<style>
  .topbar nav a[aria-current] { color: var(--ink); background: var(--paper-2); }
  main { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 20px; max-width: 1400px; margin: 0 auto; padding: 20px; align-items: start; }
  .panel { padding: 18px; display: grid; gap: 18px; position: sticky; top: 16px; }
  .panel h1 { font: 600 24px/1.1 var(--serif); margin: 0; }
  .group { display: grid; gap: 10px; }
  .group h2 { font: 700 11px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--accent-2); margin: 0; }
  .group + .group { border-top: 1px solid var(--rule); padding-top: 16px; }
  select, input[type=number] { width: 100%; border: 1px solid var(--rule); background: var(--sheet); border-radius: 10px; padding: 9px 10px; font-size: 14px; }
  input[type=number] { width: 72px; padding: 6px 8px; }
  #notes { margin: 0; font-size: 13px; color: var(--ink-2); }
  .param { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 4px 8px; }
  .param label { font: 700 13px/1.2 var(--sans); }
  .param output { font: 600 12px/1 var(--mono); color: var(--ink-2); min-width: 4.5em; text-align: right; }
  .param input[type=range] { grid-column: 1 / -1; }
  input[type=range] { width: 100%; accent-color: var(--key); margin: 0; }
  .icon-btn { appearance: none; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--rule); background: var(--card); color: var(--ink);
    border-radius: 999px; padding: 6px 10px; font: 700 12px/1 var(--sans); cursor: pointer; }
  .icon-btn:hover { border-color: var(--ink-2); }
  .icon-btn[aria-pressed=true] { background: var(--key); border-color: var(--key); color: var(--on-key); }
  .icon-btn .i { width: 15px; height: 15px; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .row output { font: 600 12px/1 var(--mono); color: var(--ink-2); margin-left: auto; }
  .member { display: grid; gap: 6px; font-size: 13px; }
  .member code { color: var(--ink-2); }
  .check { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
  .check input { accent-color: var(--key); width: 16px; height: 16px; margin: 0; }
  .stage-wrap { display: grid; gap: 12px; min-width: 0; }
  .stage { padding: 12px; }
  #view { display: block; width: 100%; height: auto; border-radius: 10px; background: var(--sheet); }
  #readout { display: flex; gap: 8px 18px; flex-wrap: wrap; margin: 10px 2px 0; font: 600 12px/1.4 var(--mono); color: var(--ink-2); }
  #readout .ok { color: var(--accent-2); }
  #readout .bad { color: var(--danger); }
  #strip-out { padding: 12px; display: grid; gap: 10px; }
  #strip-out img { display: block; max-width: 100%; height: auto; border-radius: 8px; border: 1px solid var(--rule); }
  .empty { padding: 28px; }
  @media (max-width: 860px) {
    main { grid-template-columns: minmax(0, 1fr); padding: 16px; }
    .panel { position: static; }
    .stage-wrap { order: -1; }
  }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5.5v13M16 5.5v13"/></symbol>
    <symbol id="i-sweep" viewBox="0 0 24 24"><path d="M3 12c3-7 6-7 9 0s6 7 9 0"/></symbol>
    <symbol id="i-strip" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M9 6v12M15 6v12"/></symbol>
  </svg>
  <header class="topbar">
    <a class="brand" href="../"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="7" r="3.5"/><path d="M5.5 20.5c.5-4.5 3-7.5 6.5-7.5s6 3 6.5 7.5z"/></svg>Character Lab</a>
    <nav aria-label="Lab pages"><a href="./">The lab</a><a href="score.html">Scores</a><a href="anim.html">Clips</a><a href="scenarios.html" aria-current="page">Scenarios</a></nav>
  </header>

  <main>
    <aside class="panel card" aria-label="Scenario controls">
      <div class="group">
        <p class="eyebrow" style="margin:0">Scenarios</p>
        <h1 id="name">–</h1>
        <select id="scenario" aria-label="Scenario"></select>
        <p id="notes"></p>
      </div>
      <div class="group" id="params-group">
        <h2>Params</h2>
        <div id="params"></div>
      </div>
      <div class="group">
        <h2>Time</h2>
        <div class="row"><button class="icon-btn" id="play" aria-pressed="false" title="Play the cast's clips (space)"><svg class="i"><use href="#i-play"/></svg><span>Play</span></button><output id="time-out">0.00 s</output></div>
        <input type="range" id="time" min="0" max="2" step="0.01" value="0" aria-label="Time">
        <div id="cast"></div>
      </div>
      <div class="group">
        <h2>Overlay</h2>
        <label class="check"><input type="checkbox" id="ov-slots" checked> Slots and floor</label>
        <label class="check"><input type="checkbox" id="ov-boxes" checked> Figure boxes and soles</label>
      </div>
      <div class="group">
        <h2>Filmstrip</h2>
        <select id="strip-src" aria-label="Filmstrip frames of"></select>
        <div class="row"><label for="strip-n" style="font-size:13px">Frames</label><input type="number" id="strip-n" min="2" max="24" value="8">
          <button class="icon-btn" id="strip-make"><svg class="i"><use href="#i-strip"/></svg><span>Make</span></button></div>
      </div>
    </aside>

    <section class="stage-wrap">
      <p class="notice error" id="msg" role="alert" hidden></p>
      <div class="stage card">
        <canvas id="view" width="960" height="600" aria-label="The scenario"></canvas>
        <div id="readout" aria-live="polite"></div>
      </div>
      <div class="card" id="strip-out" hidden>
        <div class="row"><strong id="strip-title">Filmstrip</strong><a class="btn small" id="strip-dl" download="filmstrip.png" style="margin-left:auto">Download PNG</a></div>
        <img id="strip-img" alt="Filmstrip">
      </div>
    </section>
  </main>

<script src="js/lab-geom.js"></script>
<script src="js/wc-gl.js"></script>
<script src="js/wc-compare.js"></script>
<script src="js/wc-parts.js"></script>
<script src="js/wc-rig.js"></script>
<script src="js/wc-anim.js"></script>
<script src="js/wc-expressions.js"></script>
<script src="js/lab-packs.js"></script>
<script src="js/lab-scenarios.js"></script>
<script src="js/lab-loader.js"></script>
<script src="js/wc-elements.js"></script>
<script src="js/lab-scenarios-page.js"></script>
</body>
</html>
