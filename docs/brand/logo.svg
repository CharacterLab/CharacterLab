<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Character Lab logo">
  <title>Character Lab</title>
  <defs>
    <clipPath id="cl-left"><rect width="256" height="512"/></clipPath>
    <clipPath id="cl-right"><rect x="256" width="256" height="512"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="#f4ecdf"/>
  <!-- left: the picture -->
  <g clip-path="url(#cl-left)">
    <circle cx="256" cy="270" r="156" fill="#b5654f"/>
    <circle cx="196" cy="256" r="22" fill="#2b2118"/>
    <circle cx="204" cy="248" r="7" fill="#fbf7ef"/>
    <circle cx="170" cy="306" r="18" fill="#d98d74"/>
    <path d="M206 332c22 26 78 26 100 0" fill="none" stroke="#2b2118" stroke-width="14" stroke-linecap="round"/>
    <path d="M222 118c4-44 58-66 92-40-26-2-42 14-38 40" fill="#2b2118"/>
  </g>
  <!-- right: the same face, drawn in code -->
  <g clip-path="url(#cl-right)" fill="none" stroke="#2b2118" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="256" cy="270" r="156"/>
    <circle cx="316" cy="256" r="22"/>
    <path d="M206 332c22 26 78 26 100 0"/>
    <path d="M222 118c4-44 58-66 92-40-26-2-42 14-38 40"/>
    <path d="M316 110 416 210" stroke="#6b4128" stroke-width="6"/>
  </g>
  <g fill="#fbf7ef" stroke="#6b4128" stroke-width="7">
    <circle cx="316" cy="110" r="13"/>
    <circle cx="416" cy="210" r="13"/>
    <rect x="352" y="146" width="28" height="28" rx="5" fill="#6b4128"/>
  </g>
  <!-- the compare line, like the lab's wipe -->
  <line x1="256" y1="52" x2="256" y2="454" stroke="#6b4128" stroke-width="8" stroke-linecap="round"/>
  <circle cx="256" cy="458" r="24" fill="#6b4128"/>
  <path d="M248 449l-9 9 9 9M264 449l9 9-9 9" fill="none" stroke="#fbf3e6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
